<!DOCTYPE html>
<html>
<head>
    <title>AstroCare - Astronaut Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
.auth-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    background: #080f20;
    font-family: Arial, sans-serif;
}

.auth-card {
    width: 100%;
    max-width: 550px;
    box-sizing: border-box;
    background: #172440;
    padding: 35px;
    border-radius: 18px;
    border: 1px solid #30466b;
    box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

.auth-card h1, .auth-card h2, .auth-card h3 {
    text-align: center;
    color: #55c8ff;
}

.auth-card label {
    display: block;
    color: white;
    margin: 15px 0 7px;
}

.auth-card input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #405779;
    background: #0d1830;
    color: white;
}

.auth-card button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #168de2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.auth-card a {
    color: #55c8ff;
}
</style>
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>🚀 AstroCare</h1>
    <h2>Astronaut Registration</h2>
    <p class="subtitle">Join the Mission Health Monitoring System</p>

    {% if message %}
        <p class="auth-message">{{ message }}</p>
    {% endif %}

    <form action="/profile" method="POST">

        <label>Astronaut Name</label>
        <input type="text" name="name" placeholder="Enter full name" required>

        <label>Space Agency</label>
        <input type="text" name="agency" placeholder="NASA" required>

        <label>Mission Name</label>
        <input type="text" name="mission" placeholder="Enter mission name" required>

        <label>Mission Role</label>
        <input type="text" name="role" placeholder="Mission Specialist" required>

        <label>Mission Duration (Days)</label>
        <input type="number" name="duration" min="1" placeholder="180" required>

        <hr>

        <h3>🔐 Account Credentials</h3>

        <label>Username</label>
        <input type="text" name="username" placeholder="Create username" required>

        <label>Password</label>
        <input type="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>

        <button type="submit">Register Astronaut</button>

    </form>

    <p class="login-link">
        Already registered? <a href="/login">Login here</a>
    </p>

    <a href="/">← Back to Home</a>

</div>
{% if message %}
<div class="toast-message" id="toastMessage">
    {{ message }}
</div>

<script>
    setTimeout(function() {
        const toast = document.getElementById("toastMessage");
        if (toast) {
            toast.style.opacity = "0";
            setTimeout(() => toast.remove(), 400);
        }
    }, 3500);
</script>
{% endif %}

</body>
</html>
